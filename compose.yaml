services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: health_records
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_records"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - health_records_data:/var/lib/postgresql/data

volumes:
  health_records_data:
